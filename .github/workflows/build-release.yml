name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Go files need formatting:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/gitfleet$(go env GOEXE)" .
      - name: Smoke test
        run: '"$RUNNER_TEMP/gitfleet$(go env GOEXE)" --help'

  release:
    name: Build binaries and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          dist_dir="$PWD/dist"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              package="gitfleet-${os}-${arch}"
              binary=gitfleet
              if [[ "$os" == windows ]]; then
                binary=gitfleet.exe
              fi
              mkdir -p "$RUNNER_TEMP/$package"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' \
                -o "$RUNNER_TEMP/$package/$binary" .
              cp README.md "$RUNNER_TEMP/$package/README.md"
              if [[ "$os" == windows ]]; then
                (cd "$RUNNER_TEMP/$package" && zip -q "$dist_dir/$package.zip" "$binary" README.md)
              else
                tar -czf "$dist_dir/$package.tar.gz" -C "$RUNNER_TEMP/$package" "$binary" README.md
              fi
            done
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          # Reuse an unfinished draft, or leave a published release intact on reruns.
          if draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"; then
            if [[ "$draft" == false ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Gitfleet $tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false
